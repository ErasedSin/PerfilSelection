<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha rede de links</title>
  <meta name="description" content="Monte a sua página de links: cole os perfis e as fotos vêm das redes." />
  <meta name="theme-color" content="#05070b" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌐%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <main class="net" id="net" aria-label="Links">
    <svg class="wires" id="wires" aria-hidden="true"></svg>
  </main>
  <button class="edit" id="editBtn" type="button">✎ Editar</button>
  <a class="edit" id="createLink" href="./" hidden>Criar a minha</a>
  <p class="status" id="status" aria-live="polite"></p>

  <dialog id="editor" aria-labelledby="edTitle">
    <form method="dialog" id="edForm">
      <h2 id="edTitle">Monte a sua página</h2>
      <label>Seu nome
        <input id="edName" type="text" maxlength="40" autocomplete="name" placeholder="Como você quer aparecer" />
      </label>
      <p class="help">Cole o link do perfil, ou escolha a rede e digite o usuário. A foto do centro vem do primeiro link. Tudo é salvo automaticamente. Fotos enviadas ficam só neste aparelho, e não vão no link compartilhado.</p>
      <div class="photo-field">
        <span>Sua foto no centro (opcional)</span>
        <button type="button" class="ph" id="edCenterPhoto" aria-label="Enviar a sua foto"></button>
      </div>
      <label>Formato <select id="edLayout"></select></label>
      <label>Fundo animado <select id="edBg"></select></label>
      <div id="edRows"></div>
      <div class="actions">
        <button type="button" class="btn" id="edPaste">Colar link copiado</button>
        <button type="button" class="btn" id="edAdd">Adicionar link</button>
        <button type="button" class="btn" id="edCopy">Copiar link (só visualização)</button>
        <button type="submit" class="btn primary">Pronto</button>
      </div>
      <p class="msg" id="edMsg" aria-live="polite"></p>
    </form>
  </dialog>

  <noscript><p class="status">Ative o JavaScript para usar a página.</p></noscript>
  <script src="bg.js"></script>
  <script src="script.js"></script>
</body>
</html>
